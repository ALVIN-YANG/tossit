server {
    listen 80;
    listen [::]:80;
    server_name tossit.mlxb.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tossit.mlxb.cc/current;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tossit.mlxb.cc;

    root /var/www/tossit.mlxb.cc/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tossit.mlxb.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tossit.mlxb.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

    location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
