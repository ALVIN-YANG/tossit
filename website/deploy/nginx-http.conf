server {
    listen 80;
    listen [::]:80;
    server_name tossit.mlxb.cc;

    root /var/www/tossit.mlxb.cc/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
